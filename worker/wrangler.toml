name = "antigravity-stateless-mcp"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

[vars]
STATELESS_MCP_MODE = "true"
MCP_ROUTE = "gc2223.com/*"
MAX_REQUESTS_PER_MINUTE = "60"
VERIFY_GOOGLE_JWKS = "false"

# Zero-PII Policy:
# Do NOT declare kv_namespaces, r2_buckets, d1_databases, durable_objects,
# or any single-user credentials/emails/tokens in environment variables.
