name: Android APK Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed Release APK/AAB (requires KEYSTORE secrets)"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Also run unit/Robolectric tests before building APK"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or generate debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            elif [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
              echo "${ANDROID_DEBUG_KEYSTORE_BASE64}" | base64 -d > debug.keystore
              echo "Restored debug.keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret."
            else
              echo "debug.keystore.base64 not found; generating ephemeral debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Restore google-services.json (from Secrets if omitted in Git)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
              echo "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
            elif [ -n "${GOOGLE_SERVICES_JSON}" ]; then
              printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "::notice::app/google-services.json not found in repo or Secrets. Zero-secret APK will build and initialize Firebase at runtime via Gateway /v1/client-config or manual/JSON bootstrap."
            fi
          fi

      - name: Build Debug APK directly
        run: >
          gradle :app:assembleDebug
          --no-daemon
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Run Unit & Robolectric Tests (Optional)
        if: inputs.run_tests == true
        run: >
          gradle :app:testDebugUnitTest
          --no-daemon
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Build Signed Release APK & AAB (Optional)
        if: inputs.build_release == true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "Skipping Release build: ANDROID_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets are not configured."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > my-upload-key.jks
          gradle :app:assembleRelease :app:bundleRelease --no-daemon
          rm -f my-upload-key.jks

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release Outputs Artifact (when built)
        if: inputs.build_release == true
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-release-outputs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: ignore
