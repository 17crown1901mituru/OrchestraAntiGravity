name: Android APK Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed Release APK/AAB (requires KEYSTORE secrets)"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Also run unit/Robolectric tests before building APK"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore deterministic debug keystore (prevent signing conflicts)
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_DEBUG_KEYSTORE_BASE64}" | base64 -d > debug.keystore
            echo "Restored deterministic debug.keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored deterministic debug.keystore from repository debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 and ANDROID_DEBUG_KEYSTORE_BASE64 missing; generating ephemeral debug.keystore (will conflict with previous builds on reinstall)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" || true

      - name: Verify zero google-services.json build (runtime OAuth + Firebase API provisioning)
        run: |
          if [ -f app/google-services.json ]; then
            echo "::warning::app/google-services.json exists on disk; removing for clean zero-config APK build."
            rm -f app/google-services.json
          fi
          echo "Building zero-google-services APK (Firebase initializes at runtime after Stage 1 Google OAuth & Stage 2 GCP project selection)."

      - name: Build Debug APK directly
        run: >
          gradle :app:assembleDebug
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}
          --no-daemon
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Run Unit & Robolectric Tests (Optional)
        if: inputs.run_tests == true
        run: >
          gradle :app:testDebugUnitTest
          --no-daemon
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Build Signed Release APK & AAB (Optional)
        if: inputs.build_release == true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "Skipping Release build: ANDROID_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets are not configured."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > my-upload-key.jks
          gradle :app:assembleRelease :app:bundleRelease \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }} \
            --no-daemon
          rm -f my-upload-key.jks

      - name: Verify APK Signing Certificates & Publish Summary
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          {
            echo "## AntiGravity APK Signing & Reinstall Check"
            echo "- Package ID: \`com.gc2223.antigravity\`"
            echo "- Version Code: \`${{ github.run_number }}\` (\`1.0.${{ github.run_number }}\`)"
            for apk in app/build/outputs/apk/*/*.apk; do
              [ -f "$apk" ] || continue
              echo "### $(basename "$apk")"
              "$APKSIGNER" verify --print-certs "$apk" | sed 's/^/- /'
            done
            echo ""
            echo "> **再インストール時の署名衝突対策**: Debug APK は共通 \`debug.keystore\` で決定的に署名されています。Release 署名や別環境の鍵でビルドされた APK から切り替える場合は、アプリ内の「再導入用バックアップ」を保存した上で \`scripts/install_apk_safe.sh --reinstall-on-conflict <apk>\` を使用してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release Outputs Artifact (when built)
        if: inputs.build_release == true
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-release-outputs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: ignore
